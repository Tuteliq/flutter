name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Audit dependencies
        run: dart pub outdated --dependency-overrides || true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Dry run publish
        run: flutter pub publish --dry-run

  osv-scan:
    # CodeQL does not support Dart, so vulnerability scanning for this repo
    # runs via OSV-Scanner instead (auto-detects pubspec.lock). This uses
    # Google's reusable workflow, not a step-level action, per the action's
    # documented usage (google.github.io/osv-scanner/github-action/).
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    continue-on-error: true # first run, unknown baseline; tighten once confirmed clean
    with:
      scan-args: |-
        --recursive
        ./
